[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sing-gateway"
version = "0.1.0"
description = "Self-hosted singing gateway: song search, clip extraction, RVC covers via Replicate, voice catalog, plaza submissions and FlowBee SSO login"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "yt-dlp>=2025.1.1",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.20"]
modelscope = ["modelscope"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
sing-gateway = "sing_gateway.server.sing:main"
sing-catalog-scrape = "sing_gateway.tools.scrape_voice_catalog:main"
sing-voice-overrides = "sing_gateway.tools.apply_voice_url_overrides:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sing_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/sing_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
